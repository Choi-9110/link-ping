<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"></head>
<body class="glow-mint">
  <div class="copy">
    <div class="eyebrow"><span class="pill">🎥 3초면 충분해요</span></div>
    <h1>해냈다면,<br><span class="m">3초 인증!</span></h1>
    <p class="sub">짧은 인증 영상 한 컷에 친구들의 응원이 도착해요.<br>잘했다고 말해주는 사람이 있으면 내일도 하게 됩니다.</p>
  </div>
  <div class="stage">
    <div class="phone"><div class="island"></div>
      <div class="screen">
        <div class="appbar">
          <div class="who"><span class="ava"><img src="../../web/icons/Icon-512.png" class="pixel"></span> 인증 갤러리</div>
          <div class="right"><span class="poring">🟣 12</span></div>
        </div>

        <div style="display:flex;gap:24px;margin-bottom:28px">
          <div style="flex:1;aspect-ratio:3/4;background:linear-gradient(160deg,#2A3A44,#17262E);border-radius:28px;border:2px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center">
            <div style="width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:52px">▶</div>
            <div style="position:absolute;bottom:22px;left:24px;font-size:30px;font-weight:700">🐻 아빠곰 · 3″</div>
            <div style="position:absolute;top:22px;right:24px;background:rgba(0,212,170,.2);color:var(--mint);font-size:26px;font-weight:800;padding:8px 18px;border-radius:20px">홈트 완료!</div>
          </div>
          <div style="flex:1;aspect-ratio:3/4;background:linear-gradient(160deg,#43303A,#241A20);border-radius:28px;border:2px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center">
            <div style="width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:52px">▶</div>
            <div style="position:absolute;bottom:22px;left:24px;font-size:30px;font-weight:700">🐰 달리는토끼 · 3″</div>
            <div style="position:absolute;top:22px;right:24px;background:rgba(255,90,95,.2);color:var(--coral-light);font-size:26px;font-weight:800;padding:8px 18px;border-radius:20px">오늘도 성공</div>
          </div>
        </div>

        <div style="display:flex;gap:24px">
          <div style="flex:1;aspect-ratio:3/4;background:linear-gradient(160deg,#2E3A2E,#1A231A);border-radius:28px;border:2px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center">
            <div style="width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:52px">▶</div>
            <div style="position:absolute;bottom:22px;left:24px;font-size:30px;font-weight:700">🧓 아버지 · 3″</div>
            <div style="position:absolute;top:22px;right:24px;background:rgba(0,212,170,.2);color:var(--mint);font-size:26px;font-weight:800;padding:8px 18px;border-radius:20px">스트레칭 ✓</div>
          </div>
          <div style="flex:1;aspect-ratio:3/4;background:var(--surface);border-radius:28px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px">
            <div style="width:120px;height:120px;border-radius:50%;background:rgba(255,90,95,.14);display:flex;align-items:center;justify-content:center;font-size:56px">📹</div>
            <div style="font-size:32px;color:var(--sub);font-weight:700">나도 인증하기</div>
          </div>
        </div>

        <div class="toast" style="bottom:480px">📣 아빠곰님이 응원을 보냈어요 💪</div>
        <div class="toast" style="bottom:340px">👉 달리는토끼님이 콕 찔렀어요 ㅋㅋ</div>

        <div class="tabbar">
          <div class="ti sel">⏰<small>알람</small></div>
          <div class="ti">🔖<small>북마크</small></div>
          <div class="ti">⚙️<small>설정</small></div>
        </div>
      </div>
    </div>
  </div>
</body></html>
