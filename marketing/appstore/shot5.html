<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"></head>
<body class="glow-purple">
  <div class="copy">
    <div class="eyebrow"><span class="pill">🏅 꾸준함이 쌓이는 재미</span></div>
    <h1>매일의 실천이<br><span class="p">기록</span>이 됩니다</h1>
    <p class="sub">스트릭이 이어지고, 배지가 모여요.<br>퀵드로우부터 365일 마라톤까지 — 수집의 맛.</p>
  </div>
  <div class="stage">
    <div class="phone"><div class="island"></div>
      <div class="screen">
        <div class="appbar">
          <div class="who"><span class="ava"><img src="../../web/icons/Icon-512.png" class="pixel"></span> 업적</div>
          <div class="right"><span class="poring">🟣 12</span></div>
        </div>

        <div style="background:linear-gradient(135deg,var(--coral),#E04A52);border-radius:36px;padding:44px 40px;margin-bottom:36px">
          <div style="display:flex;justify-content:space-around;text-align:center">
            <div><div style="font-size:54px">🔥</div><div style="font-size:58px;font-weight:900;margin-top:8px">12일</div><div style="font-size:28px;opacity:.85;margin-top:4px">연속 실천</div></div>
            <div style="width:2px;background:rgba(255,255,255,.25)"></div>
            <div><div style="font-size:54px">📊</div><div style="font-size:58px;font-weight:900;margin-top:8px">92%</div><div style="font-size:28px;opacity:.85;margin-top:4px">달성률</div></div>
            <div style="width:2px;background:rgba(255,255,255,.25)"></div>
            <div><div style="font-size:54px">🏆</div><div style="font-size:58px;font-weight:900;margin-top:8px">9/31</div><div style="font-size:28px;opacity:.85;margin-top:4px">획득 배지</div></div>
          </div>
          <div style="margin-top:36px;height:16px;border-radius:10px;background:rgba(255,255,255,.25);overflow:hidden">
            <div style="width:29%;height:100%;background:#fff;border-radius:10px"></div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
          <div style="background:var(--surface);border:3px solid var(--coral);border-radius:28px;padding:34px 16px;text-align:center"><div style="font-size:74px">⚡</div><div style="font-size:30px;font-weight:800;margin-top:14px">퀵 드로우</div><div style="font-size:24px;color:var(--mint);margin-top:8px">획득!</div></div>
          <div style="background:var(--surface);border:3px solid var(--coral);border-radius:28px;padding:34px 16px;text-align:center"><div style="font-size:74px">🔥</div><div style="font-size:30px;font-weight:800;margin-top:14px">7일 연속</div><div style="font-size:24px;color:var(--mint);margin-top:8px">획득!</div></div>
          <div style="background:var(--surface);border:3px solid var(--coral);border-radius:28px;padding:34px 16px;text-align:center"><div style="font-size:74px">🌅</div><div style="font-size:30px;font-weight:800;margin-top:14px">얼리버드</div><div style="font-size:24px;color:var(--mint);margin-top:8px">획득!</div></div>
          <div style="background:var(--surface);border:3px solid var(--coral);border-radius:28px;padding:34px 16px;text-align:center"><div style="font-size:74px">📣</div><div style="font-size:30px;font-weight:800;margin-top:14px">첫 응원</div><div style="font-size:24px;color:var(--mint);margin-top:8px">획득!</div></div>
          <div style="background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:34px 16px;text-align:center"><div style="font-size:74px;opacity:.35">👑</div><div style="font-size:30px;font-weight:800;margin-top:14px;color:var(--sub)">30일 연속</div><div style="font-size:24px;color:var(--coral);margin-top:8px;font-weight:700">12/30</div></div>
          <div style="background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:34px 16px;text-align:center"><div style="font-size:74px;opacity:.35">🦉</div><div style="font-size:30px;font-weight:800;margin-top:14px;color:var(--sub)">올빼미</div><div style="font-size:24px;color:var(--coral);margin-top:8px;font-weight:700">4/10</div></div>
        </div>

        <div class="tabbar">
          <div class="ti">⏰<small>알람</small></div>
          <div class="ti">🔖<small>북마크</small></div>
          <div class="ti sel">⚙️<small>설정</small></div>
        </div>
      </div>
    </div>
  </div>
</body></html>
